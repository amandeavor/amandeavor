<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Aman Awasthi</title>
  <desc id="description">Banking and Finance student, software builder, and open-source maintainer based in Dehradun, India.</desc>
  <style>
    .panel { fill: #f5f7f8; stroke: #d7dde2; }
    .ink { fill: #17212b; }
    .muted { fill: #62717e; }
    .quiet { fill: #87939d; }
    .rule { stroke: #c8d0d7; }
    .accent { stroke: #607d91; }
    .node { fill: #607d91; }
    .name { font: 600 64px Georgia, 'Times New Roman', serif; letter-spacing: -1.4px; }
    .eyebrow { font: 500 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 3px; }
    .role { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: .3px; }
    .label { font: 600 10px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2.1px; }
    .meta { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: .35px; }
    .sweep { stroke-dasharray: 105 895; animation: sweep 14s linear infinite; }
    @keyframes sweep { to { stroke-dashoffset: -1000; } }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #111820; stroke: #29343e; }
      .ink { fill: #edf1f3; }
      .muted { fill: #9aa8b4; }
      .quiet { fill: #73818d; }
      .rule { stroke: #33414c; }
      .accent { stroke: #87a5b8; }
      .node { fill: #87a5b8; }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>

  <rect class="panel" x="1" y="1" width="1198" height="318" rx="16" />

  <text class="eyebrow muted" x="64" y="61">FINANCE · SOFTWARE · OPEN SOURCE</text>
  <text class="name ink" x="60" y="141">Aman Awasthi</text>
  <text class="role muted" x="64" y="181">Building dependable tools across finance, automation, and systems.</text>

  <line class="rule" x1="830" y1="48" x2="830" y2="218" stroke-width="1" />

  <text class="label quiet" x="874" y="65">BASED IN</text>
  <text class="meta ink" x="874" y="91">Dehradun, India</text>

  <text class="label quiet" x="874" y="130">CURRENT WORK</text>
  <text class="meta ink" x="874" y="156">Open-source maintenance</text>

  <text class="label quiet" x="874" y="195">FOCUS</text>
  <text class="meta ink" x="874" y="221">Finance · systems · tooling</text>

  <line class="rule" x1="64" y1="258" x2="1136" y2="258" stroke-width="1" />
  <line class="accent sweep" x1="64" y1="258" x2="1136" y2="258" stroke-width="2" pathLength="1000" />

  <circle class="node" cx="68" cy="258" r="3" />
  <circle class="node" cx="600" cy="258" r="3" />
  <circle class="node" cx="1132" cy="258" r="3" />
  <text class="label muted" x="64" y="292">ANALYZE</text>
  <text class="label muted" x="570" y="292">BUILD</text>
  <text class="label muted" x="1038" y="292">MAINTAIN</text>
</svg>
