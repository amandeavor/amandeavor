<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Aman Awasthi</title>
  <desc id="description">Animated profile banner for a finance, systems, and software builder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12" />
      <stop offset="0.58" stop-color="#11152a" />
      <stop offset="1" stop-color="#0a0f16" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc">
        <animate attributeName="stop-color" values="#6d5dfc;#2dd4bf;#6d5dfc" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#6d5dfc;#2dd4bf" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8b97b7" stroke-opacity="0.11" stroke-width="1" />
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28" /></filter>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#background)" />
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />
  <circle cx="950" cy="84" r="135" fill="#6d5dfc" fill-opacity="0.22" filter="url(#blur)">
    <animate attributeName="cx" values="950;1015;950" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="84;135;84" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="1030" cy="288" r="110" fill="#2dd4bf" fill-opacity="0.16" filter="url(#blur)">
    <animate attributeName="cx" values="1030;960;1030" dur="10s" repeatCount="indefinite" />
  </circle>
  <path d="M 0 294 C 220 238 320 340 535 278 S 855 193 1200 257" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0 1800;1800 0;0 1800" dur="10s" repeatCount="indefinite" />
  </path>
  <rect x="70" y="68" width="62" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="62;132;62" dur="4s" repeatCount="indefinite" />
  </rect>
  <text x="70" y="120" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">AMAN AWASTHI</text>
  <text x="70" y="180" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="700">Finance, systems, and software.</text>
  <text x="70" y="219" fill="#b8c0dc" font-family="Segoe UI, Arial, sans-serif" font-size="19">Building organized, inspectable, and dependable workflows.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">
    <rect x="70" y="258" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="92" y="280" fill="#dce3ff">FINANCE</text>
    <rect x="198" y="258" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="220" y="280" fill="#dce3ff">SYSTEMS</text>
    <rect x="322" y="258" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="344" y="280" fill="#dce3ff">SOFTWARE</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.12" />
</svg>
